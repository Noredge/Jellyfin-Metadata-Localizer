name: Build and check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build against locked Jellyfin 12 packages
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Run synthetic checks
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Create and verify public package
        shell: pwsh
        run: ./scripts/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: artifacts/0.11.0-preview.1/*
          if-no-files-found: error
